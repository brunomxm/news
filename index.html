<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sticky-bar" id="sticky-bar">
  <span class="sticky-wordmark" id="sticky-wordmark"></span>
  <span class="sticky-section" id="sticky-section"></span>
</div>
<header class="masthead">
  <div class="masthead-top">
    <span class="wordmark" id="wordmark"></span>
  </div>
  <div class="masthead-info">
    <span class="label-nav mast-count" id="masthead-count"></span>
    <span class="label-nav" id="masthead-date"></span>
  </div>
  <nav class="jumpline" id="jumpline"></nav>
</header>
<main id="feed">
  <p class="loading">Loading&hellip;</p>
</main>
<footer class="endmark" id="endmark"></footer>
<script src="config.js"></script>
<script src="readstate.js"></script>
<script src="app.js"></script>
</body>
</html>
